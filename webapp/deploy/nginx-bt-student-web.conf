# 放置位置（宝塔面板）：/www/server/panel/vhost/nginx/student-web.conf
#
# 说明：
#   本机 nginx 由宝塔面板编译安装，http 块已定义 limit_conn_zone perip / perserver，
#   但未定义 limit_req_zone，因此这里只用 limit_conn 限制单 IP 并发，
#   请求速率限制由应用层（登录失败计数）承担。
#
#   声明 default_server 仅接管本机回环 80，不创建公网监听。

server {
    listen 127.0.0.1:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /www/wwwlogs/student-web.log;
    error_log  /www/wwwlogs/student-web-error.log;

    # 登录入口：限制并发，防撞库
    location = /login {
        limit_conn perip 10;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端伪造的 XFF；ProxyFix(x_for=1) 只信任这一层。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源：不缓存，避免改了前端但浏览器仍跑旧 JS
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 其余请求
    location / {
        limit_conn perip 20;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端伪造的 XFF；ProxyFix(x_for=1) 只信任这一层。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
