name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 回归测试与静态检查
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r register/requirements.txt -r webapp/requirements.txt
      - name: Python 语法检查
        run: python -m compileall -q register webapp scripts
      - name: JavaScript 语法检查
        shell: bash
        run: |
          for f in register/static/*.js webapp/static/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Shell 脚本语法检查
        run: bash -n register/deploy/backup_mysql.sh
      - name: register pytest
        run: python -m pytest register/tests/ -q
      - name: webapp 自检
        run: python webapp/tests/selftest.py

  audit:
    name: 依赖漏洞审计（不阻断基本回归）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: 审计依赖声明
        run: pip-audit -r register/requirements.txt -r webapp/requirements.txt
