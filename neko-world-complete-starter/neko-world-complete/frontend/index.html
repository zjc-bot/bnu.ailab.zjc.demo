<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neko World — Mochi</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="shell"><aside class="side"><div class="brand"><b>♡</b><span><strong>Neko World</strong><small>your little world together</small></span></div>
<div class="scene"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="mochi" id="avatar" data-expression="neutral" data-gesture="none"><div class="tail"></div><div class="ears"><i></i><i></i></div><div class="hair"></div><div class="face"><i class="eye e1"></i><i class="eye e2"></i><i class="blush b1"></i><i class="blush b2"></i><i class="mouth"></i></div><div class="hoodie"></div><div class="arms"><i></i><i></i></div><div id="effects"></div></div><div class="grass"></div></div>
<div class="caption"><h1>Mochi <small>ฅ^•ﻌ•^ฅ</small></h1><p id="mood">A little curious today</p></div>
<div class="settings"><label for="soul">Choose her Soul</label><select id="soul"></select><label>Animation mode</label><div class="modes"><button data-mode="normal" class="active">Normal</button><button data-mode="expressive">Expressive</button></div><p id="mode-note">Lightweight reactions. Idle animation runs locally.</p></div></aside>
<section class="chat"><header><div><span class="dot"></span><b>Chat with Mochi</b><small>Always happy to see you</small></div><button id="new-chat">＋ New chat</button></header><div class="messages" id="messages" aria-live="polite"><div class="msg assistant"><p>Hi! I'm Mochi. Welcome to our little world. What shall we talk about today? ✨</p></div></div><div id="typing" hidden>Mochi is thinking…</div><form id="form"><textarea id="input" rows="1" maxlength="8000" placeholder="Message Mochi…" required></textarea><button id="send" aria-label="Send">➤</button></form><footer>Neko World prototype</footer></section></main><script src="/app.js" defer></script></body></html>
