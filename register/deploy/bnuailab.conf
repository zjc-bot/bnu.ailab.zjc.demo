# BNU AI Lab 注册系统 · 域名反代
# 放置：/www/server/panel/vhost/nginx/bnuailab.conf
#
# 与现有 student-web.conf 共存：
#   - student-web.conf 占 80 的 default_server，反代 8080（另一站点）
#   - 本文件用 server_name 精确匹配域名，只接管 bnuailab.tech 的请求
#   - 无 Host 头或 Host 不匹配的请求仍落到 default_server，不影响原站点

server {
    listen 80;
    server_name bnuailab.tech www.bnuailab.tech;

    server_tokens off;
    client_max_body_size 6m;          # 与 Flask MAX_CONTENT_LENGTH 一致

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /www/wwwlogs/bnuailab.log;
    error_log  /www/wwwlogs/bnuailab-error.log;

    # 登录入口：并发限制
    location = /login {
        limit_conn perip 10;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加： ProxyFix(x_for=1) 取此值作真实客户端 IP，
        # 追加模式会把客户端伪造的 XFF 拼在前面，破坏 admin 白名单与限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO：必须升级连接，否则游戏退化为轮询且体验差
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加： ProxyFix(x_for=1) 取此值作真实客户端 IP，
        # 追加模式会把客户端伪造的 XFF 拼在前面，破坏 admin 白名单与限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源：不缓存，避免改了 JS 浏览器仍跑旧版
    location /static/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 头像文件：可长缓存（URL 带随机串，更新后自然换 URL）
    location /avatar/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        limit_conn perip 20;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加： ProxyFix(x_for=1) 取此值作真实客户端 IP，
        # 追加模式会把客户端伪造的 XFF 拼在前面，破坏 admin 白名单与限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    location ~ /\. {
        deny all;
    }
}
