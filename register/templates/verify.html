<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}?v=1">
<title>验证邮箱 · BNU AI Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=11">
</head>
<body><a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="topbar-left">
    <div class="mark">B</div>
    <div>
      <h1>BNU AI Lab</h1>
      <p class="sub">邮箱验证</p>
    </div>
  </div>
</header>

<main class="wrap-narrow" id="main">

  <ol class="steps">
    <li class="done"><span>✓</span>身份核验</li>
    <li class="done"><span>✓</span>填写资料</li>
    <li class="active"><span>3</span>验证邮箱</li>
  </ol>

  <div class="page-head">
    <h1>查收验证邮件</h1>
    <p>6 位验证码已发送至 <strong>{{ email }}</strong></p>
  </div>

  <div class="card">
    {% if err %}<div class="err">{{ err }}</div>{% endif %}

    <form method="post" action="{{ url_for('verify_submit') }}" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf }}">

      <label class="field">
        <span>验证码 <span class="req">*</span></span>
        <input name="code" required maxlength="6" pattern="[0-9]{6}"
               inputmode="numeric" placeholder="6 位数字"
               class="code-input">
        <p class="hint">验证码 {{ ttl }} 分钟内有效，仅可使用一次。</p>
      </label>

      <button class="btn primary block" type="submit">完成注册</button>
    </form>

    <div class="hint-center">
      <button class="btn ghost sm2" id="resend" type="button"
              data-csrf="{{ csrf }}">
        重新发送验证码
      </button>
      <p class="hint" id="resend-tip" hidden></p>
    </div>
  </div>

  <p class="center-note">
    邮箱写错了？<a href="{{ url_for('register') }}">返回重新填写</a>
  </p>
</main>

<script src="{{ url_for('static', filename='app.js') }}?v=5"></script>
</body>
</html>
