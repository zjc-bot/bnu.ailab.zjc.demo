<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>研究档案室 · 研究成果</title>
<link rel="stylesheet" href="{{ url_for('static', filename='archive.css') }}?v=1">
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="wm">研究档案室<small>Research Archive · 2021—2026</small></div>

    <nav class="stage-nav" id="nav" aria-label="成果分类"></nav>

    <a class="join-card" href="{{ url_for('register') }}" aria-label="加入研究档案室">
      <span class="join-kicker">Membership</span>
      <span class="join-main">Join in</span>
      <span class="join-sub">加入档案室 →<br /><small style="opacity:.75;font-size:10px">收藏 · 下载 · 上传你的成果</small></span>
      <span class="join-hint">点我加入 ↗</span>
    </a>

    <div class="stage-hit" id="hit"></div>

    <div class="rail-foot">
      <div class="count" id="count">01 / 08</div>
      <button class="hint" id="next">滚轮 / 方向键翻看 ↓</button>
      <button class="shuffle" id="shuffle">打散桌面 ↗</button>
      <button class="reset" id="reset">双击复位 · 点此复位</button>
      <div class="legal">© 2026 研究档案室</div>
    </div>

    <a class="selected-line" href="{{ url_for('login_page') }}">已有账号？登录 ↗</a>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="detail-sheet" id="detailSheet"></div>
</div>

<script src="{{ url_for('static', filename='archive.js') }}?v=2" data-archive-api="{{ url_for('archive_api.archive_json') }}"></script>
</body>
</html>
