<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}?v=1">
<title>二次验证 · BNU AI Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=11">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="mark">B</div>
    <div>
      <h1>BNU AI Lab</h1>
      <p class="sub">管理后台</p>
    </div>
  </div>
</header>

<main class="wrap-narrow">
  <div class="page-head">
    <h1>二次验证</h1>
    {% if purpose == 'email' %}
    <p>确认邮件已发送至 {{ target }}，请输入邮件中的 6 位验证码。确认前旧邮箱不会改变。</p>
    {% else %}
    <p>验证码已发送至管理员邮箱，5 分钟内有效，仅可使用一次。</p>
    {% endif %}
  </div>

  <div class="card">
    {% if err %}<div class="err">{{ err }}</div>{% endif %}

    <form method="post" action="{{ url_for('admin.verify_2fa_submit') }}" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf }}">

      <label class="field">
        <span>6 位验证码</span>
        <input name="code" required pattern="[0-9]{6}" maxlength="6"
               inputmode="numeric" autofocus autocomplete="one-time-code">
      </label>

      <button class="btn primary block" type="submit">验证并登录</button>
    </form>

    <p class="center-note">
      <a href="{{ url_for('admin.login') }}">返回重新登录</a>
    </p>
  </div>
</main>
</body>
</html>
