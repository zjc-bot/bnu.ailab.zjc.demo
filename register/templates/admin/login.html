<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台登录 · BNU AI Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="mark">B</div>
    <div>
      <h1>BNU AI Lab</h1>
      <p class="sub">管理后台</p>
    </div>
  </div>
</header>

<main class="wrap-narrow">
  <div class="page-head">
    <h1>管理员登录</h1>
    <p>此入口仅限实验室管理员使用。</p>
  </div>

  <div class="card">
    {% if err %}<div class="err">{{ err }}</div>{% endif %}

    <form method="post" action="{{ url_for('admin.login_submit') }}" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf }}">

      <label class="field">
        <span>管理员账号</span>
        <input name="username" required maxlength="50" autofocus autocomplete="username">
      </label>

      <label class="field">
        <span>密码</span>
        <input name="password" type="password" required maxlength="128"
               autocomplete="current-password">
      </label>

      <button class="btn primary block" type="submit">登录</button>
    </form>
  </div>

  <p class="center-note">普通用户请走 <a href="{{ url_for('register') }}">注册</a> 或
    <a href="{{ url_for('login_page') }}">登录</a></p>
</main>
</body>
</html>
