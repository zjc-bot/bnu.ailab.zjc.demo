<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}?v=1">
<meta name="csrf" content="{{ csrf }}">
<title>消息 · BNU AI Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=11">
<link rel="stylesheet" href="{{ url_for('static', filename='im.css') }}?v=7">
</head>
<body class="im-page"><a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="topbar-left">
    <div class="mark">B</div>
    <div>
      <h1>BNU AI Lab</h1>
      <p class="sub">消息</p>
    </div>
  </div>
  <div class="topbar-right">
    <nav class="admin-nav" aria-label="主导航">
      <a href="{{ url_for('home') }}" class="on" aria-current="page">消息</a>
      <a href="{{ url_for('games_page') }}">对战</a>
      <a href="{{ url_for('profile') }}">账号</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn ghost sm2" type="submit">退出</button>
    </form>
  </div>
</header>

<main class="im" id="main">

  <aside class="im-side">
    <div class="im-side-top">
      <span class="im-side-title">消息</span>
      <button class="im-add" id="btnAdd" type="button" title="添加好友" aria-label="添加好友">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="im-tabs" role="presentation">
      <span class="im-side-label">联系人 <span class="im-badge" id="reqBadge" hidden>0</span></span>
    </div>

    <div class="im-list" id="imList">
      <p class="im-none">加载中…</p>
    </div>

  </aside>

  <section class="im-main">

    <div class="im-blank" id="imBlank">
      <div class="im-blank-ico">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 21l1.9-4.5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
        </svg>
      </div>
      <p>选择左侧的联系人开始聊天</p>
      <div class="im-guide im-home-guide" id="homeGuide" role="status" hidden>
        <div class="im-guide-head">
          <div class="im-guide-text">
            <p>还没有联系人。去『添加好友』搜学号，开始第一段对话。</p>
            <div class="im-guide-steps">① 添加好友 → ② 开始聊天 → ③ 找小鲸聊聊</div>
          </div>
          <button class="im-guide-dismiss" id="homeGuideDismiss" type="button">知道了</button>
        </div>
      </div>
      <button class="btn ghost sm2" id="btnAdd2" type="button">添加好友</button>
    </div>

    <div class="im-chat" id="imChat" hidden>
      <div class="im-head">
        <button class="im-back" id="imBack" type="button" aria-label="返回联系人列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="im-head-av" id="headAv"></div>
        <div class="im-head-txt">
          <div class="im-head-name" id="headName">—</div>
          <div class="im-head-sub" id="headSub"></div>
        </div>
        <button class="im-head-more" id="btnExport" type="button" title="导出与小鲸的对话" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>
          </svg>
        </button>
        <button class="im-head-more" id="btnRemove" type="button" title="删除好友">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
          </svg>
        </button>
      </div>

      <div class="im-guide im-export-guide" id="aiExportGuide" role="status" hidden>
        <div class="im-guide-head">
          <span class="im-guide-text">可以导出全部聊天记录</span>
          <button class="im-guide-dismiss" id="aiExportGuideDismiss" type="button">知道了</button>
        </div>
      </div>

      <div class="im-body" id="imBody"></div>

      <!-- 场景带：无边框，嵌在聊天区下方；AI 会话时角色随情绪变化 -->
      <div class="im-stage" id="imStage" hidden
           aria-label="小鲸的场景">
        <div class="im-stage-scene" aria-hidden="true">
          <span class="st-cloud c1"></span><span class="st-cloud c2"></span>
          <span class="st-ground"></span>
        </div>
        <div class="im-stage-pet" id="stagePet" aria-hidden="true">
          <img src="{{ url_for('static', filename='whale/avatar.webp') }}?v=1" alt="">
        </div>
        <div class="im-stage-mood" id="stageMood">在这里陪你</div>
      </div>

      <div class="im-foot">
        <textarea id="imInput" rows="1" maxlength="2000"
                  placeholder="输入消息，Enter 发送"></textarea>
        <button class="btn primary" id="imSend" type="button">发送</button>
      </div>
    </div>

  </section>

</main>

<!-- 添加好友 -->
<div class="im-modal" id="addModal" role="dialog" aria-modal="true"
     aria-labelledby="addModalTitle" hidden>
  <div class="im-modal-mask" data-close></div>
  <div class="im-modal-box">
    <div class="im-modal-head">
      <h3 id="addModalTitle">添加好友</h3>
      <button class="im-x" type="button" data-close aria-label="关闭">&times;</button>
    </div>

    <div class="im-modal-body">
      <label class="im-field">
        <span>对方学号</span>
        <div class="im-search-row">
          <input id="searchNo" type="text" maxlength="20" inputmode="numeric"
                 placeholder="如 202611081065" autocomplete="off">
          <button class="btn ghost sm2" id="searchBtn" type="button">查找</button>
        </div>
      </label>

      <div id="searchResult" class="im-result" hidden></div>

      <label class="im-field" id="noteField" hidden>
        <span>验证消息（可选）</span>
        <input id="reqNote" type="text" maxlength="100" placeholder="我是…">
      </label>

      <p class="im-hint" id="addHint"></p>
    </div>

    <div class="im-modal-foot">
      <button class="btn ghost" type="button" data-close>取消</button>
      <button class="btn primary" id="sendReq" type="button" disabled>发送申请</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='im.js') }}?v=10"></script>
</body>
</html>
